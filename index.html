<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的主页</title>
    <style>
        /* 全局重置与基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f9fafc;
            --text: #1e2b3c;
            --muted: #5e6f8d;
            --primary: #2d5f9a;
            --card-bg: #ffffff;
            --border-light: #e2e8f0;
            --radius: 12px;
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.02), 0 1px 3px rgba(0, 0, 0, 0.03);
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', 'Noto Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }
    </style>
</head>
<body>
    <h1>你点开看了吗</h1>
    <a href="https://www.douyin.com">来刷会儿抖音吧</a>
    <p>或者</p>
    <a href="https://github.com/ucktnu/">访问我的主页</a>
</body>
</html>
